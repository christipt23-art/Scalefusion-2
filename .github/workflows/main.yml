
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project (unzip if uploaded as a zip)
        shell: bash
        run: |
          set -e

          if compgen -G "./*.zip" > /dev/null; then
            mkdir -p project
            unzip -q -o ./*.zip -d project
          fi

          GR="$(find . -name gradlew \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -type f | head -n 1)"

          if [ -z "$GR" ]; then
            echo "::error::gradlew not found. Check your repository or ZIP file."
            exit 1
          fi

          APPDIR="$(dirname "$GR")"
          echo "Project folder: $APPDIR"
          echo "APPDIR=$APPDIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Build release APK
        working-directory: ${{ env.APPDIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrilliantLauncher-apk
          path: ${{ env.APPDIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
